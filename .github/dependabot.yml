# Dependency updates (E-01-06). Versions stay exact: Dependabot proposes the new exact
# version and the PR goes through the normal CI gate. No pre-releases are auto-proposed
# for exact pins; anything that is not a stable release is closed by hand.
version: 2
updates:
  # `bun` reads package.json and bun.lock. Dependabot does not accept
  # `versioning-strategy` for bun (only bundler, cargo, composer, helm, mix, npm, pip,
  # pub and uv), so the default strategy applies: exact pins are bumped to the new
  # exact version.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      babylon:
        patterns:
          - "@babylonjs/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  # Actions are pinned by commit SHA with the version in a comment; Dependabot
  # updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
