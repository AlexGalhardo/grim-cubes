name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  # hashFiles() is not available in job-level `if`, so the optional jobs
  # (build-web, e2e) are gated by this job's outputs instead.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      web: ${{ steps.files.outputs.web }}
      e2e: ${{ steps.files.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - id: files
        run: |
          web=false
          e2e=false
          if [ -f apps/web/vite.config.ts ]; then web=true; fi
          if [ "$web" = true ] && [ -f playwright.config.ts ]; then e2e=true; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run lint:md
      - run: bun tools/lint-extra/index.ts
      - run: bun run data:check

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun check tools

  unit:
    name: unit
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx vitest run --project "unit*" --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx vitest run --project integration

  build-web:
    name: build-web
    needs: [gate, integration]
    if: needs.gate.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run data:check
      - run: bun run assets:build
      - run: bunx vite build --config apps/web/vite.config.ts --mode web-demo --outDir "$GITHUB_WORKSPACE/dist" --emptyOutDir
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  e2e:
    name: e2e
    needs: [gate, build-web]
    if: needs.gate.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: bunx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
