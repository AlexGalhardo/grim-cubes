name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build
        run: |
          bun run data:check
          if [ -f apps/web/vite.config.ts ]; then bun run build; fi

      - name: SBOM and checksums
        run: bun tools/sbom/index.ts --out release-assets

      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: bun tools/release/index.ts notes "${TAG#v}" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-rc.*) flags="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag $flags release-assets/*
