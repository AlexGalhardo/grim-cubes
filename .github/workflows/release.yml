name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - name: Wait for green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The release commit and its tag are pushed together, so ci.yml may still be queued or running.
        run: |
          id=""
          for _ in $(seq 1 30); do
            id=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$id" ]; then break; fi
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "no ci.yml run found for $GITHUB_SHA" >&2
            exit 1
          fi
          gh run watch "$id" --exit-status

      - name: Build
        run: |
          bun run data:check
          if [ -f apps/web/vite.config.ts ]; then bun run build; fi

      - name: SBOM and checksums
        run: bun tools/sbom/index.ts --out release-assets

      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: bun tools/release/index.ts notes "${TAG#v}" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-rc.*) flags="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag $flags release-assets/*
