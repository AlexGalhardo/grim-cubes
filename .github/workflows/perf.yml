name: perf

# A-01-03, PO 2026-11-01 option A: not on every push. Run it by hand, or on a pull request that carries the label perf.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  actions: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  perf:
    name: perf
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'perf' ||
      contains(toJSON(github.event.pull_request.labels), '"name":"perf"')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g bun@${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run data:check
      - run: bun run assets:build
      - run: bunx vite build --config apps/web/vite.config.ts --mode web-demo
        env:
          GC_DEBUG_API: "1"
      - name: Baseline from the last green perf run on main
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow perf.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then gh run download "$id" --name perf-main --dir baseline; fi
      - name: Bench x3
        run: |
          for i in 1 2 3; do
            bun run test:perf -- --project=desktop-1080
            mkdir -p "perf-runs/$i"
            cp reports/perf-desktop-1080.json "perf-runs/$i/"
          done
      - name: Compare with main
        run: bun tools/perf/compare.ts --runs perf-runs --baseline baseline --project desktop-1080
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.ref == 'refs/heads/main'
        with:
          name: perf-main
          path: perf-current.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-runs
          path: perf-runs/
          if-no-files-found: warn
