name: Update visual snapshots

# Regenerates the linux Playwright baselines inside the same container the e2e job uses.
# Download the artifact and commit the PNGs into tests/visual/__screenshots__/.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  update-snapshots:
    name: update-snapshots (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same sharding as the CI e2e job: one browser saturates a runner, so the suite is split across runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Playwright image has no unzip, which setup-bun needs; npm ships the same Bun binary.
      - run: npm install -g bun@${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run data:check
      - run: bun run assets:build
      # The debug API is needed by levelup.spec; same build as the e2e job.
      - run: bunx vite build --config apps/web/vite.config.ts --mode web-demo
        env:
          GC_DEBUG_API: "1"
      # In CI mode Playwright can report the run that writes new baselines as failed; the second run is the real check.
      - run: bunx playwright test --shard=${{ matrix.shard }}/4 --update-snapshots=all || true
      - run: bunx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Upload even when the verification run is red, so a flaky capture can be inspected.
        if: always()
        with:
          name: linux-snapshots-${{ matrix.shard }}
          path: tests/visual/__screenshots__/*-linux.png
          if-no-files-found: warn
