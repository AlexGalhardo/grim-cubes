appId: com.alexgalhardo.grimcubes
productName: Grim Cubes
directories:
  output: release
  buildResources: build
asar: true
files:
  - dist/**
  - apps/electron/dist/**
  - package.json
  - "!node_modules/**"
win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
    # The unpacked folder (release/win-unpacked) is what the Steam upload ships; the release workflow does not attach it.
    - target: dir
      arch: x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: GrimCubes-Setup-${version}.${ext}
portable:
  artifactName: GrimCubes-${version}-portable.${ext}
publish: null
# Hardening of the Electron binary itself (the page already has no Node): no ELECTRON_RUN_AS_NODE, no NODE_OPTIONS and
# no --inspect, and the app only loads from the asar, whose integrity is checked at start.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
